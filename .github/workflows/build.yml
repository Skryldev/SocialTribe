name: Build Zig Library

# on:
#   push:
#     tags:
#       - "v*"

#   pull_request:

#   workflow_dispatch:

permissions:
  contents: read


jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest


    defaults:
      run:
        working-directory: backend/tribecore


    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip


      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0


      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools-scm


      - name: Build Zig native library
        working-directory: backend/tribecore/zig_core
        run: |
          zig version
          zig build -Doptimize=ReleaseFast


      - name: Prepare native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/tribecore/_libs | Out-Null
          Copy-Item zig_core/zig-out/bin/*.dll src/tribecore/_libs/


      - name: Prepare native library (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p src/tribecore/_libs
          cp zig_core/zig-out/lib/*.so src/tribecore/_libs/


      - name: Prepare native library (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p src/tribecore/_libs
          cp zig_core/zig-out/lib/*.dylib src/tribecore/_libs/


      - name: Verify package version
        run: |
          python -m setuptools_scm


      - name: Build package
        run: |
          python -m build

      - name: Verify artifacts
        run: |
          python -c "from pathlib import Path; dist=Path('dist'); assert dist.exists(), 'dist directory does not exist'; files=list(dist.iterdir()); assert files, 'dist directory is empty'; print('Build artifacts:'); [print(f'- {f.name}') for f in files]"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tribecore-${{ runner.os }}
          path: backend/tribecore/dist/*
          if-no-files-found: error