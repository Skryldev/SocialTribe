/graph/network:
  get:
    tags:
      - Graph
    summary: Export Graph
    description: Export the entire graph structure including all nodes and edges
    operationId: exportGraph
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '../schemas/graph.yaml#/ExportGraphResponse'
      '422':
        $ref: '../responses/errors.yaml#/ValidationError'

/graph/metadata:
  get:
    tags:
      - Graph
    summary: Get Graph Metadata
    description: Retrieve metadata for the current graph
    operationId: getGraphMetadata
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '../schemas/graph.yaml#/GraphMetadataResponse'
      '422':
        $ref: '../responses/errors.yaml#/ValidationError'