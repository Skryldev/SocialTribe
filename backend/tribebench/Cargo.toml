[package]
name = "benchmark-server"
version = "1.0.0"
edition = "2021"
description = "High-performance benchmark server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/benchmark-server"
readme = "README.md"
keywords = ["benchmark", "server", "performance", "axum"]
categories = ["network-programming", "web-programming"]
authors = ["Your Name <your.email@example.com>"]

[[bin]]
name = "benchmark-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.42", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "request-id"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.27"

thiserror = "2.0"
anyhow = "1.0"

rand = "0.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
once_cell = "1.19"
hostname = "0.4"
sysinfo = "0.32"
num_cpus = "1.16"
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }

prometheus = { version = "0.13", features = ["process"] }

flate2 = "1.0"
brotli = "7.0"

rustls = "0.23"
hyper-rustls = "0.27"

config = "0.14"
dotenvy = "0.15"

[dev-dependencies]
mockall = "0.13"
pretty_assertions = "1.4"
tokio-test = "0.4"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 1
debug = true

[profile.docker]
inherits = "release"
strip = true
lto = true
codegen-units = 1

[build-dependencies]
winres = "0.1"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
